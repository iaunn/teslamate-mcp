name = "get_time_in_states"
description = "Get how much time each car spent in each tracked state (online, asleep, offline, etc.), with occurrence counts and total hours. Ported from the TeslaMate States dashboard."


[[output]]
name = "car_name"
type = "string"

[[output]]
name = "state"
type = "string"

[[output]]
name = "occurrences"
type = "integer"

[[output]]
name = "total_hours"
type = "number"

[[params]]
name = "car_name"
type = "string"
description = "Optional car name to filter by"

[[params]]
name = "days"
type = "integer"
description = "Number of past days to analyze (default 30)"
default = 30
