name = "get_service_tracker"
description = "Provides maintenance reminders (tire rotation, cabin filter) based on current odometer readings and actual recorded tire rotations in ledger.car_expenses."

[[params]]
name = "car_name"
type = "string"
description = "Optional car name to filter by"

[[output]]
name = "car_name"
type = "string"

[[output]]
name = "current_odometer_km"
type = "number"

[[output]]
name = "last_tire_rotation_odometer_km"
type = "number"

[[output]]
name = "km_since_last_tire_rotation"
type = "number"

[[output]]
name = "km_until_next_tire_rotation"
type = "number"

[[output]]
name = "km_until_next_cabin_filter"
type = "number"

[[output]]
name = "total_tire_rotations_due"
type = "number"

[[output]]
name = "total_cabin_filters_due"
type = "number"
